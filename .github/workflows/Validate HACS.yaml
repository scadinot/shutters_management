name: Validate HACS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate-hacs:
    name: HACS Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
